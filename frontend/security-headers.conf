# Included in every location that sets its own add_header: nginx drops all
# inherited add_header lines from a block that declares any of its own.

# Browsers ignore HSTS over plain HTTP, so this is inert until TLS is in front
# and then pins the site to HTTPS for a year.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The main defence against XSS stealing the session tokens kept in
# localStorage. style-src allows inline style attributes, which React emits.
# The API and activity stream are same-origin; if VITE_API_BASE ever points at
# another host, add it to connect-src. LinkedIn avatars come from licdn.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.licdn.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
