# Per-client-IP request budgets. If another proxy sits in front of this one,
# $binary_remote_addr is that proxy and every user shares one budget; configure
# set_real_ip_from / real_ip_header for that proxy before relying on these.
#
# Sign-in, registration and token refresh: slow enough to make password
# guessing impractical, generous enough for a person who mistypes. The
# per-account lockout in the backend covers guesses spread over many IPs.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# Everything else on the API: absorbs floods without bothering real use.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location /linkedin-agent/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Favicon handling for both prefixed (/linkedin-agent/) and root paths
    location = /linkedin-agent/favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
        include /etc/nginx/security-headers.conf;
    }

    location = /linkedin-agent/favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        default_type image/svg+xml;
        include /etc/nginx/security-headers.conf;
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
        include /etc/nginx/security-headers.conf;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.svg;
        default_type image/svg+xml;
        include /etc/nginx/security-headers.conf;
    }

    # Only the endpoints that accept a credential or create an account. The
    # rest of /api/auth/ (/me, /me/settings, ...) is called on every page load
    # and is already behind a valid token.
    location ~ ^/linkedin-agent/api/auth/(login|register|refresh|me/password|linkedin/callback|verify-email|resend-verification)$ {
        limit_req zone=auth burst=10 nodelay;

        rewrite ^/linkedin-agent(/.*)$ $1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /linkedin-agent/api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The activity feed is server-sent events: no buffering, no timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Client-side routing: unknown paths fall through to the SPA.
    location /linkedin-agent/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
