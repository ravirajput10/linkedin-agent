name: linkedin-agent

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DEBUG: ${DEBUG:-false}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: ${DB_NAME:-linkedin_agent}
  DB_SCHEMA: ${DB_SCHEMA:-linkedin_agent}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-claude}
  CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
  CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
  LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://ollama:11434}
  LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
  PLATFORM_ADAPTER: ${PLATFORM_ADAPTER:-mock}
  COMPOSITE_READ_ADAPTER: ${COMPOSITE_READ_ADAPTER:-brightdata}
  COMPOSITE_WRITE_ADAPTER: ${COMPOSITE_WRITE_ADAPTER:-unipile}
  DRY_RUN: ${DRY_RUN:-true}
  SECRET_KEY: ${SECRET_KEY:-change-me}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
  UNIPILE_DSN: ${UNIPILE_DSN:-}
  UNIPILE_API_KEY: ${UNIPILE_API_KEY:-}
  UNIPILE_ACCOUNT_ID: ${UNIPILE_ACCOUNT_ID:-}
  UNIPILE_SEARCH_API: ${UNIPILE_SEARCH_API:-classic}
  BRIGHTDATA_API_TOKEN: ${BRIGHTDATA_API_TOKEN:-}
  # --- Payments & Billing (Stripe) ---
  DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-stripe}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
  STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY:-}
  STRIPE_PRICE_STARTER_ANNUAL: ${STRIPE_PRICE_STARTER_ANNUAL:-}
  STRIPE_PRICE_GROWTH_MONTHLY: ${STRIPE_PRICE_GROWTH_MONTHLY:-}
  STRIPE_PRICE_GROWTH_ANNUAL: ${STRIPE_PRICE_GROWTH_ANNUAL:-}
  STRIPE_PRICE_SCALE_MONTHLY: ${STRIPE_PRICE_SCALE_MONTHLY:-}
  STRIPE_PRICE_SCALE_ANNUAL: ${STRIPE_PRICE_SCALE_ANNUAL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-linkedin_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Loopback only: reachable from this machine for local tools, never from
    # the network. Other containers use the compose network, not this port.
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-linkedin_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Without a password anyone who reaches Redis can enqueue Celery tasks.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
    environment: *backend-env
    command: ["python", "-m", "scripts.init_db"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-env
    # Loopback only: public traffic must come through the frontend's nginx,
    # which adds security headers and rate limits that bypassing it would skip.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment: *backend-env
    command: ["celery", "-A", "app.scheduler.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2", "--pool=threads"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
    environment: *backend-env
    command: ["celery", "-A", "app.scheduler.celery_app:celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
