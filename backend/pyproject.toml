[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI depends() in defaults is idiomatic
    "RUF012",  # ClassVar annotations on mutable class attrs
    "B027",    # optional lifecycle hooks on ABCs are deliberately non-abstract
    "RUF001",  # typographic quotes appear in prompt-facing copy
    "UP046",   # PEP 695 generics break generic Pydantic models
    "SIM102",  # nested ifs read better when each guard has its own message
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"alembic/env.py" = ["E402"]
"scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
